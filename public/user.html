<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceAPI - User Endpoints</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: 'Poppins', sans-serif;
        }

        .endpoint-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            transition: all 0.2s ease;
        }

        .endpoint-card:hover {
            border-color: #9333ea;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.1);
        }

        .response-box {
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            max-height: 400px;
            overflow-y: auto;
        }

        .json-key {
            color: #a78bfa;
        }

        .json-string {
            color: #34d399;
        }

        .json-number {
            color: #fbbf24;
        }

        .json-boolean {
            color: #c084fc;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        .tab-active {
            background: #9333ea;
            color: white;
        }

        .tab-inactive {
            background: #1a1a1a;
            color: #9ca3af;
            border: 1px solid #2a2a2a;
        }

        .filter-active {
            background: #9333ea !important;
            color: white !important;
        }
    </style>
</head>

<body class="min-h-screen p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white mb-1">User Endpoints</h1>
                <p class="text-gray-400 text-sm">Testing ground buat user endpoints</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAllResponses()" id="toggleAllBtn"
                    class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm font-medium transition-all">
                    Expand All
                </button>
                <a href="/"
                    class="px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-medium transition-all text-sm">
                    ← Admin Endpoints
                </a>
            </div>
        </div>

        <!-- Auth -->
        <div
            class="bg-gradient-to-r from-purple-600/10 to-purple-500/10 border border-purple-500/20 rounded-xl p-6 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-white">Login User</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="email" id="userEmail" value="john@example.com"
                    class="bg-black/50 border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500"
                    placeholder="Email">
                <input type="password" id="userPassword" value="User123!"
                    class="bg-black/50 border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500"
                    placeholder="Password">
                <button onclick="userLogin()"
                    class="bg-purple-600 hover:bg-purple-500 text-white font-medium py-2.5 rounded-lg transition-all text-sm">
                    Login
                </button>
            </div>
            <div class="mt-4">
                <label class="text-xs text-gray-500 block mb-1.5">Token:</label>
                <input type="text" id="userToken" readonly
                    class="w-full bg-black/50 border border-gray-800 rounded-lg px-4 py-2 text-xs font-mono text-purple-400"
                    placeholder="Login to get token...">
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="switchTab('profile')" id="tab-profile"
                class="tab-active px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Profile</button>
            <button onclick="switchTab('accounts')" id="tab-accounts"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Accounts</button>
            <button onclick="switchTab('transactions')" id="tab-transactions"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Transactions</button>
            <button onclick="switchTab('budgets')" id="tab-budgets"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Budgets</button>
            <button onclick="switchTab('savings')" id="tab-savings"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Savings</button>
            <button onclick="switchTab('investments')" id="tab-investments"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Investments</button>
            <button onclick="switchTab('debts')" id="tab-debts"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Debts</button>
            <button onclick="switchTab('bills')" id="tab-bills"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Bills</button>
            <button onclick="switchTab('recurring')" id="tab-recurring"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Recurring</button>
            <button onclick="switchTab('analytics')" id="tab-analytics"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Analytics</button>
            <button onclick="switchTab('other')" id="tab-other"
                class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Other</button>
        </div>

        <!-- Search & Filter -->
        <div class="flex flex-wrap gap-3 mb-6 items-center">
            <div class="relative flex-1 min-w-[200px] max-w-md">
                <input type="text" id="endpointSearch" placeholder="Search endpoints..."
                    class="w-full bg-black/50 border border-gray-800 rounded-lg pl-10 pr-4 py-2 text-sm text-white placeholder-gray-500"
                    oninput="filterEndpoints()">
                <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <div class="flex gap-2 flex-wrap">
                <button onclick="setMethodFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-lg text-xs font-medium filter-active">All</button>
                <button onclick="setMethodFilter('GET')" id="filter-GET" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700">GET</button>
                <button onclick="setMethodFilter('POST')" id="filter-POST" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700">POST</button>
                <button onclick="setMethodFilter('PATCH')" id="filter-PATCH" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700">PATCH</button>
                <button onclick="setMethodFilter('DELETE')" id="filter-DELETE" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700">DELETE</button>
            </div>
            <span id="resultCount" class="text-xs text-gray-500 ml-auto">Loading...</span>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500">Show:</span>
                <select id="pageSize" onchange="changePageSize()" class="bg-black/50 border border-gray-800 rounded px-2 py-1 text-xs text-white">
                    <option value="6">6</option>
                    <option value="12" selected>12</option>
                    <option value="24">24</option>
                    <option value="50">All</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="prevPage()" id="prevBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled>← Prev</button>
                <span id="pageInfo" class="text-xs text-gray-500">Page 1 of 1</span>
                <button onclick="nextPage()" id="nextBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed">Next →</button>
            </div>
        </div>

        <!-- Endpoints Container -->
        <div id="endpoints-container" class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <!-- Will be populated by JavaScript -->
        </div>
    </div>

    <script>
        let userToken = '';
        let currentPage = 1;
        let pageSize = 12;
        let methodFilter = 'all';
        let searchQuery = '';
        let filteredEndpoints = [];
        let isAllExpanded = false;

        const endpoints = {
            profile: [
                { method: 'GET', path: '/profile/', name: 'Get Profile' },
                { method: 'POST', path: '/auth/register', name: 'Register', body: { name: 'Jane Doe', email: 'jane@example.com', password: 'User123!', username: 'janedoe' } },
                { method: 'POST', path: '/auth/password/change', name: 'Change Password', body: { current_password: 'User123!', new_password: 'NewUser123!' } },
                { method: 'POST', path: '/auth/logout', name: 'Logout' }
            ],
            accounts: [
                { method: 'POST', path: '/account/', name: 'Create Account', body: { name: 'BCA Savings', type: 'savings', balance: 15000000 } },
                { method: 'GET', path: '/account/', name: 'List Accounts' },
                { method: 'GET', path: '/account/summary', name: 'Account Summary' },
                { method: 'GET', path: '/account/type/:type', name: 'Accounts by Type', needsParam: true, paramName: 'Type (savings/checking)' },
                { method: 'GET', path: '/account/groups', name: 'Account Groups' },
                { method: 'POST', path: '/account/groups', name: 'Create Account Group' },
                { method: 'GET', path: '/account/:id', name: 'Account Detail', needsParam: true, paramName: 'Account ID' },
                { method: 'PATCH', path: '/account/:id', name: 'Update Account', needsParam: true, paramName: 'Account ID' },
                { method: 'PATCH', path: '/account/:id/balance', name: 'Update Balance', needsParam: true, paramName: 'Account ID', body: { balance: 18500000 } },
                { method: 'POST', path: '/account/:id/sync', name: 'Sync Account', needsParam: true, paramName: 'Account ID' },
                { method: 'DELETE', path: '/account/:id', name: 'Delete Account', needsParam: true, paramName: 'Account ID' },
                { method: 'POST', path: '/account/transfer', name: 'Transfer Funds', body: { from_account_id: 'ID1', to_account_id: 'ID2', amount: 250000, description: 'Transfer' } },
                { method: 'GET', path: '/account/transfers', name: 'Transfer History' }
            ],
            transactions: [
                { method: 'POST', path: '/transaction/new', name: 'Create Transaction', body: { amount: 75000, category: 'food', description: 'Dinner', account_id: 'ACCOUNT_ID', type: 'expense' } },
                { method: 'GET', path: '/transaction/', name: 'List Transactions' },
                { method: 'PATCH', path: '/transaction/update/:id', name: 'Update Transaction', needsParam: true, paramName: 'Transaction ID', body: { amount: 80000, description: 'Updated' } },
                { method: 'DELETE', path: '/transaction/delete/:id', name: 'Delete Transaction', needsParam: true, paramName: 'Transaction ID' },
                { method: 'GET', path: '/transaction/filter', name: 'Filter Transactions' },
                { method: 'GET', path: '/transaction/getMonthly', name: 'Monthly Summary' },
                { method: 'GET', path: '/transaction/getReport', name: 'Financial Report' }
            ],
            budgets: [
                { method: 'POST', path: '/budget/', name: 'Create Budget', body: { month: '2024-01', amount: 5000000, category: 'monthly' } },
                { method: 'GET', path: '/budget/', name: 'List Budgets' },
                { method: 'GET', path: '/budget/summary', name: 'Budget Summary' },
                { method: 'GET', path: '/budget/all-spending', name: 'All Budgets with Spending' },
                { method: 'GET', path: '/budget/by-month/:month', name: 'Budget by Month', needsParam: true, paramName: 'Month (YYYY-MM)' },
                { method: 'GET', path: '/budget/:id', name: 'Budget Detail', needsParam: true, paramName: 'Budget ID' },
                { method: 'PATCH', path: '/budget/:id', name: 'Update Budget', needsParam: true, paramName: 'Budget ID' },
                { method: 'DELETE', path: '/budget/:id', name: 'Delete Budget', needsParam: true, paramName: 'Budget ID' },
                { method: 'POST', path: '/budget/category', name: 'Create Category Budget' },
                { method: 'GET', path: '/budget/category', name: 'List Category Budgets' },
                { method: 'GET', path: '/budget/category/summary', name: 'Category Budget Summary' }
            ],
            savings: [
                { method: 'POST', path: '/savings_goal/', name: 'Create Savings Goal', body: { name: 'Emergency Fund', target_amount: 50000000, current_amount: 10000000, deadline: '2024-12-31' } },
                { method: 'GET', path: '/savings_goal/get', name: 'List Savings Goals' },
                { method: 'GET', path: '/savings_goal/summary', name: 'Savings Summary' },
                { method: 'GET', path: '/savings_goal/get/:id', name: 'Savings Goal Detail', needsParam: true, paramName: 'Goal ID' },
                { method: 'PATCH', path: '/savings_goal/update/:id', name: 'Update Savings Goal', needsParam: true, paramName: 'Goal ID' },
                { method: 'POST', path: '/savings_goal/:id/contribute', name: 'Add Contribution', needsParam: true, paramName: 'Goal ID', body: { amount: 1000000 } },
                { method: 'GET', path: '/savings_goal/:id/contributions', name: 'Contribution History', needsParam: true, paramName: 'Goal ID' },
                { method: 'DELETE', path: '/savings_goal/:id', name: 'Delete Savings Goal', needsParam: true, paramName: 'Goal ID' }
            ],
            investments: [
                { method: 'POST', path: '/investment/', name: 'Create Investment', body: { symbol: 'BTC', name: 'Bitcoin', type: 'crypto', quantity: 0.5, purchase_price: 600000000 } },
                { method: 'GET', path: '/investment/', name: 'List Investments' },
                { method: 'GET', path: '/investment/summary', name: 'Portfolio Summary' },
                { method: 'GET', path: '/investment/portfolio', name: 'Portfolio with Live Prices' },
                { method: 'GET', path: '/investment/:id', name: 'Investment Detail', needsParam: true, paramName: 'Investment ID' },
                { method: 'DELETE', path: '/investment/:id', name: 'Delete Investment', needsParam: true, paramName: 'Investment ID' },
                { method: 'POST', path: '/investment/refresh-prices', name: 'Refresh All Prices' },
                { method: 'GET', path: '/prices/crypto', name: 'Crypto Prices' },
                { method: 'GET', path: '/prices/stocks', name: 'Stock Prices' }
            ],
            debts: [
                { method: 'POST', path: '/debt/', name: 'Create Debt', body: { name: 'Car Loan', total_amount: 150000000, remaining_amount: 120000000, interest_rate: 8.5 } },
                { method: 'GET', path: '/debt/', name: 'List Debts' },
                { method: 'GET', path: '/debt/summary', name: 'Debt Summary' },
                { method: 'GET', path: '/debt/:id', name: 'Debt Detail', needsParam: true, paramName: 'Debt ID' },
                { method: 'POST', path: '/debt/:id/pay', name: 'Make Payment', needsParam: true, paramName: 'Debt ID', body: { amount: 5000000 } },
                { method: 'GET', path: '/debt/:id/history', name: 'Payment History', needsParam: true, paramName: 'Debt ID' },
                { method: 'DELETE', path: '/debt/:id', name: 'Delete Debt', needsParam: true, paramName: 'Debt ID' }
            ],
            bills: [
                { method: 'POST', path: '/bill/', name: 'Create Bill Reminder', body: { name: 'Electricity', amount: 500000, due_date: '2024-01-25' } },
                { method: 'GET', path: '/bill/', name: 'List Bill Reminders' },
                { method: 'GET', path: '/bill/due', name: 'Due Bills' },
                { method: 'GET', path: '/bill/overdue', name: 'Overdue Bills' },
                { method: 'GET', path: '/bill/summary', name: 'Bill Summary' },
                { method: 'GET', path: '/bill/:id', name: 'Bill Detail', needsParam: true, paramName: 'Bill ID' },
                { method: 'PATCH', path: '/bill/:id', name: 'Update Bill', needsParam: true, paramName: 'Bill ID' },
                { method: 'POST', path: '/bill/:id/pay', name: 'Mark as Paid', needsParam: true, paramName: 'Bill ID' },
                { method: 'DELETE', path: '/bill/:id', name: 'Delete Bill', needsParam: true, paramName: 'Bill ID' }
            ],
            recurring: [
                { method: 'POST', path: '/recurring/', name: 'Create Recurring Transaction', body: { amount: 1000000, category: 'subscription', frequency: 'monthly' } },
                { method: 'GET', path: '/recurring/', name: 'List Recurring Transactions' },
                { method: 'GET', path: '/recurring/active', name: 'Active Recurring' },
                { method: 'GET', path: '/recurring/due', name: 'Due Recurring' },
                { method: 'GET', path: '/recurring/:id', name: 'Recurring Detail', needsParam: true, paramName: 'Recurring ID' },
                { method: 'PATCH', path: '/recurring/:id', name: 'Update Recurring', needsParam: true, paramName: 'Recurring ID' },
                { method: 'POST', path: '/recurring/:id/pause', name: 'Pause Recurring', needsParam: true, paramName: 'Recurring ID' },
                { method: 'POST', path: '/recurring/:id/resume', name: 'Resume Recurring', needsParam: true, paramName: 'Recurring ID' },
                { method: 'DELETE', path: '/recurring/:id', name: 'Delete Recurring', needsParam: true, paramName: 'Recurring ID' }
            ],
            analytics: [
                { method: 'GET', path: '/analytics/', name: 'Full Analytics' },
                { method: 'GET', path: '/analytics/quick', name: 'Quick Stats' },
                { method: 'GET', path: '/analytics/goals', name: 'Goal Progress' },
                { method: 'GET', path: '/analytics/net-worth', name: 'Net Worth Detail' },
                { method: 'GET', path: '/insights/', name: 'Spending Insights' },
                { method: 'GET', path: '/insights/health', name: 'Financial Health Score' }
            ],
            other: [
                { method: 'POST', path: '/chatbot/message', name: 'Send Message to Chatbot', body: { message: 'How much did I spend this month?' } },
                { method: 'GET', path: '/chatbot/history', name: 'Chat History' },
                { method: 'GET', path: '/chatbot/summary', name: 'Financial Summary' },
                { method: 'GET', path: '/api/notifications/feed', name: 'Get Notifications' },
                { method: 'PATCH', path: '/api/notifications/feed/:id/read', name: 'Mark Notification as Read', needsParam: true, paramName: 'Notification ID' }
            ]
        };

        function switchTab(tab) {
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.className = 'tab-inactive px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap';
            });
            document.getElementById('tab-' + tab).className = 'tab-active px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap';

            document.getElementById('endpointSearch').value = '';
            searchQuery = '';
            setMethodFilter('all');
            methodFilter = 'all';
            currentPage = 1;

            applyFilters();
        }

        function filterEndpoints() {
            searchQuery = document.getElementById('endpointSearch').value.toLowerCase();
            currentPage = 1;
            applyFilters();
        }

        function setMethodFilter(method) {
            methodFilter = method;
            document.querySelectorAll('[id^="filter-"]').forEach(btn => {
                if (btn.id === 'filter-' + method) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium filter-active';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-400 hover:bg-gray-700';
                }
            });
            currentPage = 1;
            applyFilters();
        }

        function applyFilters() {
            const currentTab = document.querySelector('[class*="tab-active"]')?.id?.replace('tab-', '') || 'profile';
            const allEndpoints = endpoints[currentTab] || [];

            filteredEndpoints = allEndpoints.filter(ep => {
                const matchesSearch = ep.name.toLowerCase().includes(searchQuery) ||
                                    ep.path.toLowerCase().includes(searchQuery);
                const matchesMethod = methodFilter === 'all' || ep.method === methodFilter;
                return matchesSearch && matchesMethod;
            });

            document.getElementById('resultCount').textContent = `${filteredEndpoints.length} endpoints`;
            renderPaginatedEndpoints(currentTab);
        }

        function renderPaginatedEndpoints(tab) {
            const container = document.getElementById('endpoints-container');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageEndpoints = filteredEndpoints.slice(start, end);

            container.innerHTML = pageEndpoints.map((ep, idx) => {
                const actualIdx = start + idx;
                const methodColor = ep.method === 'GET' ? 'emerald' :
                    ep.method === 'POST' ? 'blue' :
                        ep.method === 'PATCH' ? 'amber' : 'red';
                const respId = `resp-${tab}-${actualIdx}`;
                const paramId = ep.needsParam ? `param-${tab}-${actualIdx}` : '';
                const bodyId = ep.body ? `body-${tab}-${actualIdx}` : '';

                return `
                    <div class="endpoint-card rounded-xl p-5">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <span class="px-2.5 py-1 bg-${methodColor}-500/10 text-${methodColor}-400 rounded-md text-xs font-semibold">${ep.method}</span>
                                <h3 class="text-base font-semibold text-white">${ep.name}</h3>
                            </div>
                            <button onclick="toggleResponse('${respId}')" class="text-gray-500 hover:text-gray-300 transition-colors p-1">
                                <svg id="icon-${respId}" class="w-5 h-5 transform rotate-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </button>
                        </div>
                        <code class="text-xs text-gray-400 bg-black/50 px-3 py-1.5 rounded block mb-4">${ep.path}</code>
                        ${ep.needsParam ? `
                            <input type="text" id="${paramId}" placeholder="${ep.paramName}"
                                class="w-full bg-black/50 border border-gray-800 rounded-lg px-3 py-2 text-sm text-white mb-3" />
                        ` : ''}
                        ${ep.body ? `
                            <textarea id="${bodyId}" rows="3"
                                class="w-full bg-black/50 border border-gray-800 rounded-lg px-3 py-2 text-xs font-mono text-white mb-3">${JSON.stringify(ep.body, null, 2)}</textarea>
                        ` : ''}
                        <button onclick="testEndpoint('${ep.method}', '${ep.path}', ${ep.needsParam ? `'${paramId}'` : 'null'}, ${ep.body ? `'${bodyId}'` : 'null'}, '${respId}')"
                            class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2 rounded-lg transition-all text-sm">
                            Test
                        </button>
                        <div id="${respId}" class="response-box rounded-lg p-4 mt-4 hidden">
                            <div class="text-xs text-gray-500 mb-2">Response:</div>
                            <pre class="text-xs font-mono text-gray-300"></pre>
                        </div>
                    </div>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredEndpoints.length / pageSize) || 1;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                const tab = document.querySelector('[class*="tab-active"]')?.id?.replace('tab-', '') || 'profile';
                renderPaginatedEndpoints(tab);
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredEndpoints.length / pageSize) || 1;
            if (currentPage < totalPages) {
                currentPage++;
                const tab = document.querySelector('[class*="tab-active"]')?.id?.replace('tab-', '') || 'profile';
                renderPaginatedEndpoints(tab);
            }
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            if (pageSize === 50) pageSize = 9999;
            currentPage = 1;
            const tab = document.querySelector('[class*="tab-active"]')?.id?.replace('tab-', '') || 'profile';
            applyFilters();
        }

        function toggleResponse(respId) {
            const el = document.getElementById(respId);
            const icon = document.getElementById('icon-' + respId);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                el.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        function toggleAllResponses() {
            isAllExpanded = !isAllExpanded;
            const btn = document.getElementById('toggleAllBtn');
            const allResponses = document.querySelectorAll('[id^="resp-"]');

            allResponses.forEach(el => {
                if (isAllExpanded) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            document.querySelectorAll('[id^="icon-resp-"]').forEach(icon => {
                if (isAllExpanded) {
                    icon.classList.add('rotate-180');
                } else {
                    icon.classList.remove('rotate-180');
                }
            });

            btn.textContent = isAllExpanded ? 'Collapse All' : 'Expand All';
            btn.className = isAllExpanded
                ? 'px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-medium transition-all'
                : 'px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm font-medium transition-all';
        }

        async function userLogin() {
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.token) {
                    userToken = data.token;
                    document.getElementById('userToken').value = data.token;
                    alert('Login berhasil! Sekarang bisa test endpoint.');
                } else {
                    alert('Login gagal: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function testEndpoint(method, path, paramId, bodyId, responseId) {
            if (!userToken) {
                alert('Login dulu!');
                return;
            }

            let finalPath = path;
            if (paramId) {
                const paramValue = document.getElementById(paramId).value;
                if (!paramValue) {
                    alert('Isi parameter dulu!');
                    return;
                }
                finalPath = path.replace(':id', paramValue).replace(':type', paramValue).replace(':month', paramValue);
            }

            let body = null;
            if (bodyId) {
                try {
                    body = JSON.parse(document.getElementById(bodyId).value);
                } catch (e) {
                    alert('JSON-nya salah!');
                    return;
                }
            }

            const responseBox = document.getElementById(responseId);
            const responsePre = responseBox.querySelector('pre');

            responseBox.classList.remove('hidden');
            document.getElementById('icon-' + responseId)?.classList.add('rotate-180');
            responsePre.textContent = 'Loading...';

            try {
                const options = {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${userToken}`,
                        'Content-Type': 'application/json'
                    }
                };

                if (body) {
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(finalPath, options);
                const data = await response.json();

                responsePre.innerHTML = syntaxHighlight(JSON.stringify(data, null, 2));
            } catch (error) {
                responsePre.textContent = 'Error: ' + error.message;
            }
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        // Initialize
        document.getElementById('endpointSearch').value = '';
        searchQuery = '';
        methodFilter = 'all';
        currentPage = 1;
        filteredEndpoints = endpoints['profile'] || [];
        switchTab('profile');
    </script>

</body>
